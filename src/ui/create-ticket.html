<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a ticket · Little League Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#f7f3ea"/>
          <path d="M10 16c8 6 8 10 0 16M38 16c-8 6-8 10 0 16" fill="none" stroke="#b42318" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>
          <p class="brand-kicker">Riverside Little League</p>
          <p class="brand-title">Equipment Locker</p>
        </span>
      </a>
    </div>
  </header>
  <nav class="app-nav" aria-label="Primary">
    <div class="nav-inner">
      <a href="equipment.html">Equipment</a>
    </div>
  </nav>

  <main class="page">
    <header class="page-head">
      <div>
        <p class="eyebrow">Create a ticket</p>
        <h1>Borrow equipment</h1>
        <p class="lede">Add name. Add quantity. Create ticket.</p>
      </div>
    </header>

    <section class="card panel">
      <div class="item-chip">
        <div>
          <p class="eyebrow">Selected item</p>
          <h2 id="item-name" class="item-name">Loading...</h2>
        </div>
        <p id="qty-pill" class="qty"><b>0</b> <span>available</span></p>
      </div>

      <form id="create-ticket-form" class="form">
        <div id="form-error" class="alert form-error" role="alert"></div>
        <label>
          Your name
          <input type="text" name="name" placeholder="First and last name" required>
        </label>
        <label>
          Quantity to borrow
          <input type="number" name="quantity" min="1" step="1" value="1" required>
        </label>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Create ticket</button>
          <a id="cancel-link" class="btn btn-secondary" href="equipment.html">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const equipmentId = params.get('equipmentId');
    const itemNameEl = document.querySelector('#item-name');
    const qtyPill = document.querySelector('#qty-pill');
    const cancelLink = document.querySelector('#cancel-link');
    const form = document.querySelector('#create-ticket-form');
    const formError = document.querySelector('#form-error');

    if (!equipmentId) {
      itemNameEl.textContent = 'No equipment selected';
      qtyPill.innerHTML = '<b>0</b> <span>available</span>';
      cancelLink.href = 'equipment.html';
      form.querySelector('button').disabled = true;
      formError.textContent = 'This ticket form needs an equipment selection.';
    } else {
      cancelLink.href = `list-tickets.html?equipmentId=${equipmentId}`;
      fetch('/equipment')
        .then((response) => response.json())
        .then((items) => {
          const selected = items.find((entry) => entry.equipmentId === equipmentId);
          if (!selected) {
            throw new Error('Equipment not found');
          }
          itemNameEl.textContent = selected.itemName;
          qtyPill.innerHTML = `<b>${selected.available}</b> <span>available</span>`;
        })
        .catch((error) => {
          console.error(error);
          itemNameEl.textContent = 'Equipment unavailable';
          qtyPill.innerHTML = '<b>0</b> <span>available</span>';
          formError.textContent = 'Could not load the selected item.';
          form.querySelector('button').disabled = true;
        });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!equipmentId) {
        return;
      }

      formError.textContent = '';
      const payload = {
        name: form.elements.name.value.trim(),
        quantity: Number(form.elements.quantity.value),
        equipmentId,
      };

      const response = await fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        formError.textContent = body.message || 'Unable to create ticket.';
        return;
      }

      window.location.href = `list-tickets.html?equipmentId=${equipmentId}`;
    });
  </script>
</body>
</html>
